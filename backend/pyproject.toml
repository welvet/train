[project]
name = "train"
version = "0.1.0"
description = "LEGO train automation backend"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "bleak>=0.21",
]

[project.scripts]
train = "train.__main__:main"

[tool.setuptools.package-data]
"train.modules.web_api" = ["static/**/*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
